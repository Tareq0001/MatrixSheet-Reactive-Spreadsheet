<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MatrixSheet — Institutional Reactive Spreadsheet Engine</title>
  <meta name="description" content="Next-gen spreadsheet engine with AST formula compiler, DAG reactive recalculation, topological sorting, and SVG formula auditing." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='4' fill='%23107c41'/><text x='5' y='18' font-family='Arial' font-size='16' font-weight='bold' fill='white'>X</text></svg>" />
  <script type="module" crossorigin src="./assets/index-DzauV3cR.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-wYaBlCjc.css">
</head>
<body>
  <!-- Title Bar -->
  <header class="excel-title-bar">
    <div class="brand-section">
      <svg class="excel-icon-svg" viewBox="0 0 24 24" width="24" height="24" style="width: 24px; height: 24px; max-width: 24px; max-height: 24px; flex-shrink: 0;">
        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/>
      </svg>
      <div class="workbook-title">
        <span>MatrixSheet</span>
        <span class="file-name-tag" style="opacity: 0.8; font-size: 0.8rem;">- Financial_Valuation_Model_2026.xlsx</span>
      </div>
    </div>

    <div class="title-controls">
      <button class="btn-title-action" id="btn-export-xlsx">.XLSX</button>
      <button class="btn-title-action" id="btn-export-csv">CSV</button>
      <button class="btn-title-action" id="btn-lang-toggle">العربية</button>
    </div>
  </header>

  <!-- Ribbon Tabs -->
  <nav class="ribbon-tabs">
    <div class="ribbon-tab active">Home</div>
    <div class="ribbon-tab">Insert</div>
    <div class="ribbon-tab">Formulas</div>
    <div class="ribbon-tab">Data</div>
    <div class="ribbon-tab">Review</div>
  </nav>

  <!-- Ribbon Action Bar -->
  <div class="ribbon-toolbar">
    <!-- Font Style Group -->
    <div class="tool-group">
      <button class="ribbon-btn" id="btn-bold" title="Bold (Ctrl+B)"><strong>B</strong></button>
      <button class="ribbon-btn" id="btn-italic" title="Italic (Ctrl+I)"><em>I</em></button>
      <button class="ribbon-btn" id="btn-underline" title="Underline (Ctrl+U)"><u>U</u></button>
    </div>

    <!-- Number Format Group -->
    <div class="tool-group">
      <select class="fmt-select" id="num-format-select" title="Number Format">
        <option value="general">General</option>
        <option value="currency_sar">Currency (SAR)</option>
        <option value="currency_usd">Currency (USD)</option>
        <option value="percent">Percentage (%)</option>
        <option value="decimal_2">2 Decimals</option>
      </select>
    </div>

    <!-- Formula Auditing Group -->
    <div class="tool-group">
      <button class="ribbon-btn" id="btn-trace-prec" title="Trace Precedents">
        <span style="color: #107c41; font-weight: bold;">↗</span> Precedents
      </button>
      <button class="ribbon-btn" id="btn-trace-dep" title="Trace Dependents">
        <span style="color: #d83b01; font-weight: bold;">↘</span> Dependents
      </button>
      <button class="ribbon-btn" id="btn-remove-arrows" title="Remove Arrows">
        ✕ Clear
      </button>
    </div>

    <!-- Charts Group -->
    <div class="tool-group" style="border: none;">
      <button class="ribbon-btn" id="btn-chart-col">📊 Bar</button>
      <button class="ribbon-btn" id="btn-chart-line">📈 Line</button>
      <button class="ribbon-btn" id="btn-chart-pie">🥧 Pie</button>
    </div>
  </div>

  <!-- Formula Bar -->
  <div class="formula-bar-container">
    <div class="cell-name-box" id="cell-name-box">B2</div>
    <div class="fx-symbol">fx</div>
    <input type="text" class="formula-input" id="formula-input" placeholder="Enter formula or value (e.g. =SUM(B2:E2))" />
  </div>

  <!-- Workspace Grid -->
  <main class="spreadsheet-workspace" id="spreadsheet-workspace">
    <table class="grid-table" id="grid-table"></table>
    <svg id="audit-svg-overlay"></svg>
  </main>

  <!-- Sheet Tabs Bar -->
  <footer class="sheet-tabs-bar">
    <button class="sheet-tab-item active" data-sheet="Financial Model">Financial Model</button>
    <button class="sheet-tab-item" data-sheet="CapEx & Valuation">CapEx & Valuation</button>
  </footer>

  <!-- Status Bar -->
  <div class="excel-status-bar">
    <div class="status-mode">Ready · DAG Active</div>
    <div class="status-metrics">
      <span id="stat-sum">SUM: 450,000</span>
      <span id="stat-avg">AVERAGE: 450,000</span>
      <span id="stat-count">COUNT: 1</span>
    </div>
  </div>

  <!-- Chart Modal -->
  <div id="chart-modal" class="chart-modal-overlay" style="display: none;">
    <div class="chart-modal-card">
      <div class="chart-modal-header">
        <h3>📊 Dynamic Range Chart Studio</h3>
        <button class="btn-close-chart" id="btn-close-chart">✕</button>
      </div>
      <canvas id="chart-canvas" width="680" height="340" style="max-width: 100%; height: auto;"></canvas>
    </div>
  </div>

</body>
</html>
